name: Script validation

on:
    pull_request:
    workflow_dispatch:

jobs:
    linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Check Bash syntax and help
              shell: bash
              run: |
                  bash -n z__setup_yt-dlp.sh z__run_sub_converter.sh
                  bash z__setup_yt-dlp.sh --help
                  bash z__run_sub_converter.sh --help
                  bash -n tools/migration/remove-standalone.sh
                  bash tools/migration/remove-standalone.sh --help
                  python3 tools/yt_dlp_auto_update.py --help
                  python3 -m unittest discover -s tests -p 'test_*.py'
            - name: Check Linux standalone migration
              shell: bash
              run: |
                  python3 - <<'PY'
                  import pathlib
                  import subprocess
                  import tempfile
                  import zipfile

                  with tempfile.TemporaryDirectory() as temp:
                      old = pathlib.Path(temp) / "yt-dlp"
                      with zipfile.ZipFile(old, "w") as archive:
                          archive.writestr("yt_dlp/__main__.py", "")
                          archive.writestr("yt_dlp/version.py", "")
                      subprocess.run(["bash", "tools/migration/remove-standalone.sh", "--dry-run", "--path", str(old)], check=True)
                      assert old.exists()
                      subprocess.run(["bash", "tools/migration/remove-standalone.sh", "--path", str(old)], check=True)
                      assert not old.exists()
                  PY
    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - name: Check PowerShell syntax, help and config conversion
              shell: powershell
              run: |
                  foreach ($file in Get-ChildItem -Recurse -Filter '*.ps1') {
                      $tokens = $null
                      $parseErrors = $null
                      [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
                      if ($parseErrors.Count -gt 0) { throw "$($file.Name): $parseErrors" }
                  }
                  .\z__setup_yt-dlp.ps1 --help | Out-Null
                  .\z__convert_config.ps1 --help | Out-Null
                  .\z__run_sub_converter.ps1 -Help | Out-Null
                  .\z__convert_config.ps1 | Out-Null
                  $content = Get-Content -LiteralPath 'win yt-dlp config' -Raw -Encoding UTF8
                  $expected = '-P "temp:' + $env:TEMP + '"'
                  if (-not $content.Contains($expected)) { throw 'Windows temp path was not converted.' }
                  python tools/yt_dlp_auto_update.py --help | Out-Null
                  python -m unittest discover -s tests -p 'test_*.py'
                  if ($LASTEXITCODE -ne 0) { throw 'Updater unit tests failed.' }
