name: Script validation

on:
    pull_request:
    workflow_dispatch:

jobs:
    linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Check Bash syntax and help
              shell: bash
              run: |
                  bash -n setup_yt-dlp.sh uninstall_yt-dlp.sh run_sub_converter.sh
                  if find . -path ./.git -prune -o -type f -name 'z__*' -print | grep -q .; then
                      echo 'Old z__ script filenames remain'
                      exit 1
                  fi
                  bash uninstall_yt-dlp.sh --help
                  bash uninstall_yt-dlp.sh --dry-run
                  bash setup_yt-dlp.sh --help
                  bash run_sub_converter.sh --help
                  bash -n tools/migration/remove-standalone.sh
                  bash tools/migration/remove-standalone.sh --help
                  python3 tools/yt_dlp_auto_update.py --help
                  python3 -m unittest discover -s tests -p 'test_*.py'
            - name: Check Linux standalone migration
              shell: bash
              run: |
                  python3 - <<'PY'
                  import pathlib
                  import subprocess
                  import tempfile
                  import zipfile

                  with tempfile.TemporaryDirectory() as temp:
                      old = pathlib.Path(temp) / "yt-dlp"
                      with zipfile.ZipFile(old, "w") as archive:
                          archive.writestr("yt_dlp/__main__.py", "")
                          archive.writestr("yt_dlp/version.py", "")
                      subprocess.run(["bash", "tools/migration/remove-standalone.sh", "--dry-run", "--path", str(old)], check=True)
                      assert old.exists()
                      subprocess.run(["bash", "tools/migration/remove-standalone.sh", "--path", str(old)], check=True)
                      assert not old.exists()
                  PY
    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - name: Check PowerShell syntax, help and config conversion
              shell: powershell
              run: |
                  foreach ($file in Get-ChildItem -Recurse -Filter '*.ps1') {
                      $tokens = $null
                      $parseErrors = $null
                      [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
                      if ($parseErrors.Count -gt 0) { throw "$($file.Name): $parseErrors" }
                  }
                  .\setup_yt-dlp.ps1 --help | Out-Null
                  .\tools\build_mpc_be_shim.ps1 --help | Out-Null
                  $installer = Get-Content -LiteralPath 'setup_yt-dlp.ps1' -Raw -Encoding UTF8
                  if ($installer -match 'winget') { throw 'Windows installer still depends on winget.' }
                  if (-not $installer.Contains('static-ffmpeg')) { throw 'FFmpeg pip fallback is missing.' }
                  if (-not $installer.Contains('Get-Command ffmpeg')) { throw 'Existing FFmpeg detection is missing.' }
                  if (-not $installer.Contains('Get-Command ffprobe')) { throw 'Existing FFprobe detection is missing.' }
                  if (-not $installer.Contains('Get-Command aria2c')) { throw 'Existing aria2 detection is missing.' }

                  .\uninstall_yt-dlp.ps1 --help | Out-Null
                  .\tools\migration\cleanup-legacy.ps1 --help | Out-Null
                  .\uninstall_yt-dlp.ps1 --cleanup-only --help | Out-Null
                  .\uninstall_yt-dlp.ps1 --dry-run | Out-Null
                  .\convert_config.ps1 --help | Out-Null
                  .\run_sub_converter.ps1 -Help | Out-Null
                  .\convert_config.ps1 | Out-Null
                  $content = Get-Content -LiteralPath 'win yt-dlp config' -Raw -Encoding UTF8
                  $expected = '-P "temp:' + $env:TEMP + '"'
                  if (-not $content.Contains($expected)) { throw 'Windows temp path was not converted.' }
                  python tools/yt_dlp_auto_update.py --help | Out-Null
                  python -m unittest discover -s tests -p 'test_*.py'
                  if ($LASTEXITCODE -ne 0) { throw 'Updater unit tests failed.' }
            - name: Run FFmpeg helper via PowerShell with a mocked static-ffmpeg package
              shell: powershell
              run: |
                  $mockRoot = Join-Path $env:RUNNER_TEMP 'ffmpeg mock package'
                  $mockModule = Join-Path $mockRoot 'static_ffmpeg'
                  $outputDir = Join-Path $env:RUNNER_TEMP 'ffmpeg output with spaces'
                  New-Item -ItemType Directory -Path $mockModule -Force | Out-Null
                  Set-Content -LiteralPath (Join-Path $mockModule '__init__.py') -Value '' -Encoding ASCII
                  Set-Content -LiteralPath (Join-Path $mockModule 'run.py') -Value 'import os; get_or_fetch_platform_executables_else_raise = lambda: (os.environ["FFMPEG_TEST_SOURCE"], os.environ["FFPROBE_TEST_SOURCE"])' -Encoding ASCII
                  $stub = @'
                  using System;
                  public static class FakeFfmpegTest {
                      public static int Main(string[] args) {
                          return args.Length == 1 && args[0] == "-version" ? 0 : 1;
                      }
                  }
                  '@
                  $fakeFfmpeg = Join-Path $mockRoot 'source ffmpeg.exe'
                  $fakeFfprobe = Join-Path $mockRoot 'source ffprobe.exe'
                  Add-Type -TypeDefinition $stub -OutputAssembly $fakeFfmpeg -OutputType ConsoleApplication
                  Copy-Item -LiteralPath $fakeFfmpeg -Destination $fakeFfprobe
                  $originalPythonPath = $env:PYTHONPATH
                  try {
                      $env:PYTHONPATH = $mockRoot
                      $env:FFMPEG_TEST_SOURCE = $fakeFfmpeg
                      $env:FFPROBE_TEST_SOURCE = $fakeFfprobe
                      & python tools/install_ffmpeg.py $outputDir
                      if ($LASTEXITCODE -ne 0) { throw 'PowerShell could not invoke FFmpeg helper.' }
                      foreach ($name in @('ffmpeg.exe', 'ffprobe.exe')) {
                          $executable = Join-Path $outputDir $name
                          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw "Missing: $name" }
                          & $executable -version
                          if ($LASTEXITCODE -ne 0) { throw "Invalid installed executable: $name" }
                      }
                  }
                  finally {
                      $env:PYTHONPATH = $originalPythonPath
                      Remove-Item Env:FFMPEG_TEST_SOURCE, Env:FFPROBE_TEST_SOURCE -ErrorAction SilentlyContinue
                  }
            - name: Check Windows Gist removal and keep-current cleanup
              shell: powershell
              run: |
                  $gistId = '21141912fbacf40877f4cf877577e082'
                  $gistPath = Join-Path $HOME $gistId
                  if (Test-Path -LiteralPath $gistPath) { throw 'Legacy Gist test location is already occupied.' }
                  $source = Join-Path $env:RUNNER_TEMP 'gist-fixture-source'
                  $remote = Join-Path $env:RUNNER_TEMP 'gist-fixture-remote.git'
                  $oldLocal = $env:LOCALAPPDATA
                  $oldApp = $env:APPDATA
                  $runtime = Join-Path (Get-Location).ProviderPath '.runtime\windows'
                  try {
                      $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'gist-test-appdata\local'
                      $env:APPDATA = Join-Path $env:RUNNER_TEMP 'gist-test-appdata\roaming'
                      New-Item -ItemType Directory -Path $source, $env:LOCALAPPDATA, $env:APPDATA -Force | Out-Null
                      & git init --bare --initial-branch=main $remote | Out-Null
                      & git -C $source init --initial-branch=main | Out-Null
                      Set-Content -LiteralPath (Join-Path $source 'yt-dlp config') -Value 'legacy' -Encoding ASCII
                      Set-Content -LiteralPath (Join-Path $source '.gitignore') -Value 'win yt-dlp config' -Encoding ASCII
                      & git -C $source add . | Out-Null
                      & git -C $source -c user.name=CI -c user.email=ci@example.invalid commit -m initial | Out-Null
                      & git -C $source remote add origin $remote | Out-Null
                      & git -C $source push -u origin main | Out-Null
                      & git clone $remote $gistPath | Out-Null
                      & git -C $gistPath remote set-url origin "https://gist.github.com/$gistId.git"
                      .\tools\migration\cleanup-legacy.ps1 --dry-run | Out-Null
                      if (-not (Test-Path -LiteralPath $gistPath)) { throw 'Gist dry-run removed clone.' }
                      .\tools\migration\cleanup-legacy.ps1 | Out-Null
                      if (Test-Path -LiteralPath $gistPath) { throw 'Clean Gist clone was not removed.' }
                      & git clone $remote $gistPath | Out-Null
                      & git -C $gistPath remote set-url origin "https://gist.github.com/$gistId.git"
                      Set-Content -LiteralPath (Join-Path $gistPath 'win yt-dlp config') -Value 'generated' -Encoding ASCII
                      .\tools\migration\cleanup-legacy.ps1 | Out-Null
                      if (Test-Path -LiteralPath $gistPath) { throw 'Gist with known ignored config was not removed.' }
                      & git clone $remote $gistPath | Out-Null
                      & git -C $gistPath remote set-url origin "https://gist.github.com/$gistId.git"
                      & git -C $gistPath checkout --detach HEAD | Out-Null
                      .\tools\migration\cleanup-legacy.ps1 | Out-Null
                      if (Test-Path -LiteralPath $gistPath) { throw 'Detached Gist clone was not removed.' }
                      & git clone $remote $gistPath | Out-Null
                      & git -C $gistPath remote set-url origin "https://gist.github.com/$gistId.git"
                      Set-Content -LiteralPath (Join-Path $gistPath 'private.txt') -Value 'keep' -Encoding ASCII
                      .\tools\migration\cleanup-legacy.ps1 | Out-Null
                      if (Test-Path -LiteralPath $gistPath) { throw 'Dirty Gist clone was not removed.' }
                      $bin = Join-Path $runtime 'bin'
                      $venv = Join-Path $runtime 'venv\Scripts'
                      New-Item -ItemType Directory -Path $bin, $venv -Force | Out-Null
                      Set-Content -LiteralPath (Join-Path $bin 'yt-dlp.cmd') -Value '@echo off' -Encoding ASCII
                      Set-Content -LiteralPath (Join-Path $venv 'python.exe') -Value 'python' -Encoding ASCII
                      $configDir = Join-Path $env:APPDATA 'yt-dlp'
                      New-Item -ItemType Directory -Path $configDir -Force | Out-Null
                      Set-Content -LiteralPath (Join-Path $configDir 'config') -Value 'current' -Encoding ASCII
                      $oldVenv = Join-Path $env:LOCALAPPDATA 'yt-dlp\venv'
                      New-Item -ItemType Directory -Path (Join-Path $oldVenv 'Scripts') -Force | Out-Null
                      Set-Content -LiteralPath (Join-Path $oldVenv 'pyvenv.cfg') -Value 'home = CI' -Encoding ASCII
                      Set-Content -LiteralPath (Join-Path $oldVenv 'Scripts\yt-dlp.exe') -Value 'test' -Encoding ASCII
                      .\uninstall_yt-dlp.ps1 --cleanup-only --dry-run | Out-Null
                      if (-not (Test-Path -LiteralPath $oldVenv)) { throw 'Cleanup dry-run removed legacy venv.' }
                      .\uninstall_yt-dlp.ps1 --cleanup-only | Out-Null
                      if (Test-Path -LiteralPath $oldVenv) { throw 'Cleanup-only kept old venv.' }
                      if (-not (Test-Path -LiteralPath (Join-Path $runtime 'venv\Scripts\python.exe'))) { throw 'Cleanup-only removed current venv.' }
                      if (-not (Test-Path -LiteralPath (Join-Path $configDir 'config'))) { throw 'Cleanup-only removed current config.' }
                      if (Test-Path -LiteralPath $gistPath) { throw 'Cleanup-only did not remove dirty Gist.' }
                  }
                  finally {
                      $env:LOCALAPPDATA = $oldLocal
                      $env:APPDATA = $oldApp
                      if (Test-Path -LiteralPath $gistPath) { Remove-Item -LiteralPath $gistPath -Recurse -Force }
                      if (Test-Path -LiteralPath $runtime) { Remove-Item -LiteralPath $runtime -Recurse -Force }
                  }
            - name: Check Windows default full uninstall removes clean Git checkout
              shell: powershell
              run: |
                  $source = Join-Path $env:RUNNER_TEMP 'full-uninstall-source'
                  $remote = Join-Path $env:RUNNER_TEMP 'full-uninstall-remote.git'
                  $checkout = Join-Path $env:RUNNER_TEMP 'full-uninstall-checkout'
                  $oldLocal = $env:LOCALAPPDATA
                  $oldApp = $env:APPDATA
                  try {
                      New-Item -ItemType Directory -Path (Join-Path $source 'tools\migration') -Force | Out-Null
                      Copy-Item -LiteralPath 'uninstall_yt-dlp.ps1' -Destination $source
                      Copy-Item -LiteralPath 'setup_yt-dlp.ps1' -Destination $source
                      Copy-Item -LiteralPath 'yt-dlp config' -Destination $source
                      Copy-Item -LiteralPath 'tools\migration\cleanup-legacy.ps1' -Destination (Join-Path $source 'tools\migration')
                      Set-Content -LiteralPath (Join-Path $source '.gitignore') -Value '.runtime/' -Encoding ASCII
                      & git init --bare --initial-branch=main $remote | Out-Null
                      & git -C $source init --initial-branch=main | Out-Null
                      & git -C $source add . | Out-Null
                      & git -C $source -c user.name=CI -c user.email=ci@example.invalid commit -m initial | Out-Null
                      & git -C $source remote add origin $remote | Out-Null
                      & git -C $source push -u origin main | Out-Null
                      & git clone $remote $checkout | Out-Null
                      & git -C $checkout remote set-url origin 'https://github.com/SyameimaruKoa/My_yt-dlp_config_script.git'
                      Set-Content -LiteralPath (Join-Path $checkout 'local-change.txt') -Value 'modified' -Encoding ASCII
                      $runtime = Join-Path $checkout '.runtime\windows\venv'
                      New-Item -ItemType Directory -Path $runtime -Force | Out-Null
                      Set-Content -LiteralPath (Join-Path $runtime 'pyvenv.cfg') -Value 'home = CI' -Encoding ASCII
                      $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'full-uninstall-appdata\local'
                      $env:APPDATA = Join-Path $env:RUNNER_TEMP 'full-uninstall-appdata\roaming'
                      New-Item -ItemType Directory -Path $env:LOCALAPPDATA, $env:APPDATA -Force | Out-Null
                      & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $checkout 'uninstall_yt-dlp.ps1') | Out-Null
                      if ($LASTEXITCODE -ne 0) { throw 'Full uninstall failed.' }
                      if (Test-Path -LiteralPath $checkout) { throw 'Modified checkout was not removed by default.' }
                  }
                  finally {
                      $env:LOCALAPPDATA = $oldLocal
                      $env:APPDATA = $oldApp
                  }
            - name: Check Windows uninstall discovery and dry-run
              shell: powershell
              run: |
                  $savedLocal = $env:LOCALAPPDATA
                  $savedApp = $env:APPDATA
                  try {
                      $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'yt-dlp-uninstall-test\local'
                      $env:APPDATA = Join-Path $env:RUNNER_TEMP 'yt-dlp-uninstall-test\roaming'
                      New-Item -ItemType Directory -Path $env:LOCALAPPDATA, $env:APPDATA -Force | Out-Null
                      $empty = @(.\uninstall_yt-dlp.ps1 --dry-run)
                      if (-not ($empty -match [regex]::Escape((-join @([char]0x5bfe, [char]0x8c61, [char]0x306a, [char]0x3057, [char]0xff08, [char]0x65e7, [char]0x76, [char]0x65, [char]0x6e, [char]0x76, [char]0xff09))))) { throw 'Missing install is not reported.' }
                      $venv = Join-Path $env:LOCALAPPDATA 'yt-dlp\venv'
                      New-Item -ItemType Directory -Path (Join-Path $venv 'Scripts') -Force | Out-Null
                      Set-Content -LiteralPath (Join-Path $venv 'pyvenv.cfg') -Value 'home = CI' -Encoding UTF8
                      Set-Content -LiteralPath (Join-Path $venv 'Scripts\yt-dlp.exe') -Value 'test' -Encoding ASCII
                      $updater = Join-Path $env:LOCALAPPDATA 'yt-dlp\auto_update.py'
                      Set-Content -LiteralPath $updater -Value 'yt-dlp-update.lock' -Encoding ASCII
                      $outputs = @(.\uninstall_yt-dlp.ps1 --dry-run)
                      if (-not ($outputs -match [regex]::Escape((-join @([char]0x65e7, [char]0x76, [char]0x65, [char]0x6e, [char]0x76, [char]0x524a, [char]0x9664, [char]0x4e88, [char]0x5b9a))))) { throw 'Legacy venv was not found.' }
                      if (-not ($outputs -match 'auto_update.py')) { throw 'Legacy updater was not found.' }
                      if (-not (Test-Path -LiteralPath $updater)) { throw 'Dry-run deleted the updater.' }
                      if (-not (Test-Path -LiteralPath (Join-Path $venv 'pyvenv.cfg'))) { throw 'Dry-run deleted venv.' }
                  }
                  finally {
                      $env:LOCALAPPDATA = $savedLocal
                      $env:APPDATA = $savedApp
                  }
            - name: Check MPC-BE dedicated exe shim
              shell: powershell
              run: |
                  $testDir = Join-Path $env:RUNNER_TEMP 'MPC BE Test'
                  New-Item -ItemType Directory -Path $testDir -Force | Out-Null
                  $targetExe = Join-Path $testDir 'yt-dlp.exe'
                  $shimExe = Join-Path $testDir 'mpc-be\yt-dlp.exe'
                  $shimConfig = [System.IO.Path]::ChangeExtension($shimExe, '.shim')
                  $output = Join-Path $testDir 'arguments.txt'
                  $stub = @'
                  using System;
                  using System.IO;
                  using System.Text;
                  public static class Stub {
                      public static int Main(string[] args) {
                          File.WriteAllLines(Environment.GetEnvironmentVariable("YT_DLP_SHIM_TEST_OUTPUT"), args, new UTF8Encoding(false));
                          return 17;
                      }
                  }
                  '@
                  Add-Type -TypeDefinition $stub -OutputAssembly $targetExe -OutputType ConsoleApplication
                  New-Item -ItemType Directory -Path (Split-Path -Parent $shimExe) -Force | Out-Null
                  .\tools\build_mpc_be_shim.ps1 -Source 'tools/mpc_be_yt_dlp_shim.cs' -Output $shimExe
                  if (-not (Test-Path -LiteralPath $shimExe -PathType Leaf)) { throw 'MPC-BE shim builder did not produce an executable.' }
                  [System.IO.File]::WriteAllText($shimConfig, "$targetExe`n--ignore-config", [System.Text.Encoding]::UTF8)
                  $env:YT_DLP_SHIM_TEST_OUTPUT = $output
                  $env:YT_DLP_SKIP_UPDATE = '1'
                  $jpArgument = (-join @([char]0x65e5, [char]0x672c, [char]0x8a9e)) + ' name.mp4'
                  & $shimExe '--format=bv*+ba' $jpArgument '--output' 'C:\Video Files\%(title)s.%(ext)s'
                  if ($LASTEXITCODE -ne 17) { throw 'MPC-BE shim did not pass through child exit code.' }
                  $actual = [System.IO.File]::ReadAllLines($output, [System.Text.Encoding]::UTF8)
                  $expected = @('--ignore-config', '--format=bv*+ba', $jpArgument, '--output', 'C:\Video Files\%(title)s.%(ext)s')
                  if ([string]::Join('|', $actual) -cne [string]::Join('|', $expected)) {
                      throw ("MPC-BE shim argument mismatch: " + [string]::Join('|', $actual))
                  }
                  Write-Output 'MPC-BE shim test passed.'
                  exit 0
            - name: Check PowerShell 7 MPC-BE shim build and argument forwarding
              shell: pwsh
              run: |
                  $testDir = Join-Path $env:RUNNER_TEMP 'MPC BE Test'
                  $targetExe = Join-Path $testDir 'yt-dlp.exe'
                  if (-not (Test-Path -LiteralPath $targetExe -PathType Leaf)) { throw 'Target stub was not built.' }
                  $shimExe = Join-Path $testDir 'Pwsh 7 Shim\yt-dlp.exe'
                  $shimConfig = [System.IO.Path]::ChangeExtension($shimExe, '.shim')
                  $output = Join-Path $testDir 'arguments-pwsh7.txt'
                  .\tools\build_mpc_be_shim.ps1 -Source 'tools/mpc_be_yt_dlp_shim.cs' -Output $shimExe
                  if (-not (Test-Path -LiteralPath $shimExe -PathType Leaf)) { throw 'PowerShell 7 shim compilation failed.' }
                  [System.IO.File]::WriteAllText($shimConfig, "$targetExe`n--ignore-config", [System.Text.Encoding]::UTF8)
                  $env:YT_DLP_SHIM_TEST_OUTPUT = $output
                  $env:YT_DLP_SKIP_UPDATE = '1'
                  $jpArgument = (-join @([char]0x65e5, [char]0x672c, [char]0x8a9e)) + ' name.mp4'
                  & $shimExe '--format=bv*+ba' $jpArgument '--output' 'C:\Video Files\%(title)s.%(ext)s'
                  if ($LASTEXITCODE -ne 17) { throw 'PowerShell 7 shim did not forward child exit code.' }
                  $actual = [System.IO.File]::ReadAllLines($output, [System.Text.Encoding]::UTF8)
                  $expected = @('--ignore-config', '--format=bv*+ba', $jpArgument, '--output', 'C:\Video Files\%(title)s.%(ext)s')
                  if ([string]::Join('|', $actual) -cne [string]::Join('|', $expected)) {
                      throw ("PowerShell 7 shim arguments differ: " + [string]::Join('|', $actual))
                  }
